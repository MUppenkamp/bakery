<!-- TODO https://github.com/MUppenkamp/bakery/issues/4 -->
<nav class="sticky w-full z-20 top-0 inset-s-0 bg-bakery-bg/70 backdrop-blur-xs">
  <div class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="/" class="flex items-center space-x-3">
      <img src="Hello_Kitty.svg" class="h-7" alt="Hello Kitty Logo" />
      <span class="text-xl font-semibold">MONAKU</span>
    </a>
    <button
      data-collapse-toggle="navbar-default"
      type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base sm:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
      aria-controls="navbar-default"
      aria-expanded="false"
    >
      <span class="sr-only">Open main menu</span>
      <ng-icon name="featherMenu" />
    </button>
    <div class="hidden w-auto sm:block" id="navbar-default">
      <ul class="font-medium flex p-0 bg-neutral-secondary-soft flex-row space-x-8 mt-0 border-0">
        @for (item of items; track $index) {
          <li>
            <a [href]="item.url">{{ item.name }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
