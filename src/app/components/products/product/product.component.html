@let product = product$();
<div class="flex gap-4 max-w-130">
  <img [src]="product.imageUrl" [alt]="product.name" class="w-40 h-auto object-cover rounded-lg" />

  <div class="flex flex-col gap-2">
    <div class="flex gap-2 items-baseline">
      <p class="title-l">
        {{ product.name }}
      </p>
      <ng-icon
        class="text-bakery-text-soft! hover:text-bakery-accent-green-hover!"
        name="featherAlertCircle"
      />
    </div>
    <p class="text-bakery-text-soft line-clamp-3 sm:line-clamp-5">
      {{ product.description }}
    </p>
    <!-- TODO https://github.com/MUppenkamp/bakery/issues/8 -->
    <div class="">{{ product.price | currency: 'EUR' }}</div>

    <div>
      <button
        class="button-primary px-3 py-1"
        (click)="productsService.updateSelectedProducts(product.id, 1)"
      >
        Hinzufügen
      </button>
    </div>
  </div>
</div>
