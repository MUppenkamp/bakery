@let products = productsService.products$();
<div class="mt-10 max-w-full">
  <h2 class="text-center uppercase mb-8">Produkte</h2>
  @if (products.length) {
    <div class="flex flex-wrap gap-x-6 gap-y-8 justify-center">
      @for (product of products; track product) {
        <div>
          <app-product class="" [product$]="product" />
        </div>
      }
    </div>
  }
</div>
