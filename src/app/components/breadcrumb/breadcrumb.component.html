<!-- TODO https://github.com/MUppenkamp/bakery/issues/4 -->
<nav class="w-full bg-bakery-bg/70 backdrop-blur-xs">
  <div class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-4">
    <monauppi-link [href$]="'/'">
      <div class="flex items-center space-x-3">
        <img src="logo.png" class="h-9" alt="Pinker Brotkorb mit Broten Logo" />
        <span class="text-xl font-semibold">MONAKU</span>
      </div>
    </monauppi-link>
    <div class="w-auto block" id="navbar-default">
      <ul class="font-medium flex p-0 bg-neutral-secondary-soft flex-row space-x-8 mt-0 border-0">
        @for (item of items; track $index) {
          <li>
            <monauppi-link [href$]="item.url">
              <span>{{ item.name }}</span>
            </monauppi-link>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
